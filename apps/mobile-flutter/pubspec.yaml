name: mobile_flutter
description: A new Flutter project for the Physiotherapy Appointment Booking Platform.
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management & DI
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Router
  go_router: ^14.2.1

  # Network & Secure Storage
  dio: ^5.5.0
  flutter_secure_storage: ^9.2.2

  # Firebase Cloud Messaging
  firebase_core: ^3.12.1
  firebase_messaging: ^15.2.4

  # Payments
  razorpay_flutter: ^1.3.5

  # Utilities
  intl: ^0.19.0
  flutter_svg: ^2.0.10
  cupertino_icons: ^1.0.6
  url_launcher: ^6.3.0
  image_picker: ^1.1.2
  image_picker_for_web: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  riverpod_generator: ^2.4.0
  build_runner: ^2.4.11

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/dr_rajnish_head.png
    - assets/images/dr_priyanka_head.png
    - assets/images/dr_rajnish_bariyar.png
    - assets/images/dr_priyanka_bariyar.png
    - assets/images/doctors_together.png
